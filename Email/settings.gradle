// AOSP Email revivido — com.android.email
// Projeto único, um módulo Gradle "app" que reproduz o target `Email` do
// Android.mk original: fonte de Email/ + UnifiedEmail/ + emailcommon
// integrados via sourceSets, sem fundir fisicamente as árvores.

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "AOSPEmailRevived"
include(":app")

// Bibliotecas AOSP vendorizadas (ver VENDORIZAR.md)
include(":chips")
project(":chips").projectDir = file("vendor/chips")
include(":photoviewer")
project(":photoviewer").projectDir = file("vendor/photoviewer")
include(":bitmap")
project(":bitmap").projectDir = file("vendor/bitmap")
include(":common")
project(":common").projectDir = file("vendor/common")
