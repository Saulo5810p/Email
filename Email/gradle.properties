# === Toolchain do projeto AOSP Email Revivido ===
# Gradle alvo: 8.9+ (ver TOOLCHAIN.md — 9.6.1 + AGP 8.7.x NÃO é combinação
# oficialmente suportada; use 8.9-8.13 com AGP 8.7.x até a doc oficial mudar).
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# === AAPT2 nativo do Termux ===
# Antes do primeiro build, detecte o binário real e descomente a linha abaixo
# apontando para o caminho verdadeiro. Comandos de detecção:
#   command -v aapt2
#   aapt2 version
# No Termux o binário normalmente vem do pacote `aapt2` (pkg install aapt2)
# e fica em $PREFIX/bin/aapt2, que resolve para algo como:
#   /data/data/com.termux/files/usr/bin/aapt2
#
# android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
#
# Se o AAPT2 do Termux não processar compileSdk 35, caia para compileSdk 34
# (já é o padrão deste projeto, conforme solicitado) antes de tentar qualquer
# outra coisa. Não baixe um AAPT2 substituto sem necessidade comprovada.
